<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1019"><title>Dot Bot — Portable Companion</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1019;color:#f4f8fc;font:14px/1.55 system-ui,Segoe UI,sans-serif}body{display:flex;flex-direction:column;min-height:100vh;background:radial-gradient(circle at 50% 32%,#263b54,#0b1019 64%)}header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #ffffff1c;font-weight:700;letter-spacing:.04em}.status{font-size:11px;color:#aeece9;font-weight:400}main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 12px}.orb{margin:8px 0 22px;width:140px;height:140px;border-radius:50%;position:relative;background:radial-gradient(circle at 33% 20%,#525761,#17191f 36%,#010103 73%);box-shadow:inset -12px -15px 25px #000,0 18px 30px #000a,0 0 48px #b0efff22;animation:float 5s ease-in-out infinite}.eyes{position:absolute;top:42%;left:21%;right:21%;display:flex;justify-content:space-between}.eye{background:white;width:23%;height:29px;border-radius:50%;box-shadow:0 0 14px #c9fbff,0 0 25px #8ce6f9}.chat{width:100%;display:flex;flex-direction:column;gap:10px;flex:1;justify-content:flex-end;max-width:430px}.bubble{padding:11px 13px;border-radius:15px;max-width:93%;font-size:13px}.bot{align-self:flex-start;background:#1d2b3e}.user{align-self:flex-end;background:#b5f5f2;color:#08121c}.choices{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:15px 0}.choices button{background:#ffffff12;border:1px solid #ffffff2d;border-radius:20px;color:#e4f5f7;padding:9px 11px;cursor:pointer;font:inherit;font-size:12px}.choices button:hover,.choices button:focus-visible{background:#b5f5f2;color:#08121c}footer{font-size:11px;text-align:center;color:#a2b2c4;padding:10px 15px 16px;border-top:1px solid #ffffff1c}a{color:#b5f5f2}@keyframes float{50%{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><header><span>● DOT BOT</span><span class="status">Portable companion · Preview</span></header><main><div class="orb" role="img" aria-label="Dot Bot, black spherical companion with two glowing white eyes"><div class="eyes"><div class="eye"></div><div class="eye"></div></div></div><div class="chat" id="chat" aria-live="polite"><div class="bubble bot">Hello! I'm here if you need a little company while you browse.</div></div><div class="choices"><button data-topic="hello">Say hello</button><button data-topic="idea">An idea?</button><button data-topic="purpose">Your purpose?</button></div></main><footer>Scripted preview — live AI is not connected yet.<br><a href="https://getdotbot.uk" target="_blank" rel="noopener noreferrer">getdotbot.uk</a> · <a href="https://apps.microsoft.com/detail/9mvgch7k7nlr" target="_blank" rel="noopener noreferrer">Windows app ↗</a></footer><script>
const answers={hello:["Hello Dot Bot!","Hello there. Fancy meeting you out here on the internet!"],idea:["Have you got an idea?","How about a tiny game where you collect lost stars and return them to the night sky?"],purpose:["What's your purpose?","To keep good company, help people create and make a little room for wonder."]};const chat=document.getElementById('chat');document.querySelectorAll('[data-topic]').forEach(button=>button.addEventListener('click',()=>{chat.replaceChildren();answers[button.dataset.topic].forEach((message,i)=>{const el=document.createElement('div');el.className='bubble '+(i?'bot':'user');el.textContent=message;chat.appendChild(el)})}));
</script></body></html>
