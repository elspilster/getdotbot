<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1019"><title>Dot Bot — Portable Companion</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1019;color:#f4f8fc;font:14px/1.55 system-ui,Segoe UI,sans-serif}body{display:flex;flex-direction:column;height:100dvh;min-height:420px;background:radial-gradient(circle at 50% 25%,#263b54,#0b1019 65%)}header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #ffffff1c;font-weight:700;letter-spacing:.04em}.modebar{display:flex;gap:6px;overflow-x:auto;max-width:520px;width:100%;padding:8px 0}.modebar button{flex:0 0 auto;border:1px solid #ffffff3a;border-radius:20px;background:#ffffff0b;color:#d9e8f4;padding:7px 11px;font-size:12px;cursor:pointer}.modebar button[aria-pressed="true"]{background:#b5f5f2;color:#0b1620;border-color:#b5f5f2;font-weight:700}.status{font-size:11px;color:#aeece9;font-weight:400}.tools{display:flex;gap:7px}.tools button{background:#ffffff12;border:1px solid #ffffff2d;color:#e6f6fc;border-radius:15px;padding:5px 9px;font-size:11px;cursor:pointer}main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:10px 13px}.orb{margin:3px 0 12px;width:98px;height:98px;flex-shrink:0;border-radius:50%;position:relative;background:radial-gradient(circle at 33% 20%,#525761,#17191f 36%,#010103 73%);box-shadow:inset -12px -15px 25px #000,0 14px 25px #000a,0 0 42px #b0efff22;animation:float 5s ease-in-out infinite}.eyes{position:absolute;top:42%;left:21%;right:21%;display:flex;justify-content:space-between}.eye{background:white;width:23%;height:22px;border-radius:50%;box-shadow:0 0 14px #c9fbff,0 0 25px #8ce6f9}.chat{width:100%;display:flex;flex-direction:column;gap:9px;flex:1;min-height:80px;overflow-y:auto;max-width:520px;padding:8px 4px}.bubble{padding:10px 12px;border-radius:15px;max-width:94%;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:#1d2b3e}.user{align-self:flex-end;background:#b5f5f2;color:#08121c}.setup{width:100%;max-width:520px;padding:12px;border:1px solid #ffffff25;background:#121f2c;border-radius:14px;margin:8px 0}.setup p{font-size:12px;color:#c1d2e0;margin:4px 0 9px}.setup label{font-size:12px}.setup input{width:100%;padding:10px;background:#0b1019;border:1px solid #72869b;color:white;border-radius:8px;margin:6px 0}.setup button,.composer button{border:0;border-radius:10px;background:#b5f5f2;color:#08121c;padding:10px 15px;font-weight:700;cursor:pointer}.composer{width:100%;max-width:520px;display:flex;gap:8px;padding:9px 0}.composer input{min-width:0;flex:1;border-radius:11px;border:1px solid #ffffff3a;background:#192638;color:white;padding:11px;font:inherit}.composer button:disabled{opacity:.5;cursor:wait}.notice{font-size:11px;color:#aabbd0;padding:0 12px 8px;text-align:center}.error{color:#ffd0ca;font-size:12px;min-height:18px}footer{font-size:10px;text-align:center;color:#a2b2c4;padding:7px;border-top:1px solid #ffffff1c}a{color:#b5f5f2}button:focus-visible,input:focus-visible{outline:2px solid #b5f5f2;outline-offset:2px}[hidden]{display:none!important}@keyframes float{50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><script defer src="/_vercel/insights/script.js"></script></head><body>
<header><span>● DOT BOT</span><div class="tools"><span class="status" id="status">Web beta</span><button type="button" id="reset">New chat</button></div></header>
<main><div class="orb" role="img" aria-label="Dot Bot, black spherical companion with two glowing white eyes"><div class="eyes"><div class="eye"></div><div class="eye"></div></div></div><nav class="modebar" aria-label="Dot Bot modes"><button type="button" data-mode="chat" aria-pressed="true">💬 Chat</button><button type="button" data-mode="windows" aria-pressed="false">🖥 Windows</button><button type="button" data-mode="creative" aria-pressed="false">🎨 Create</button><button type="button" data-mode="minecraft" aria-pressed="false">🧱 Minecraft</button></nav><div class="chat" id="chat" role="log" aria-live="polite"><div class="bubble bot">Hello! I’m Dot Bot. What shall we talk about?</div></div>

<div class="error" id="error" role="alert"></div><form class="composer" id="composer"><input id="message" maxlength="3500" placeholder="Say something to Dot Bot…" aria-label="Message Dot Bot" autocomplete="off" required><button id="send" type="submit">Send</button></form><div class="notice">Free web trial · Up to 20 replies per hour (per server instance). No API key needed.</div></main><footer><a href="https://getdotbot.uk" target="_blank" rel="noopener noreferrer">getdotbot.uk</a> · <a href="https://apps.microsoft.com/detail/9mvgch7k7nlr" target="_blank" rel="noopener noreferrer">Windows app ↗</a></footer>
<script>
const MODES={chat:'Hello! I’m Dot Bot. What shall we talk about?',windows:'Windows help it is! Tell me what you’re trying to find or fix.',creative:'Let’s make something interesting. What have you got in mind?',minecraft:'Ready to explore Minecraft? Tell me what you want to build or learn.'};const params=new URLSearchParams(location.search);let mode=Object.hasOwn(MODES,params.get('mode'))?params.get('mode'):'chat';let messages=[],busy=false;const $=id=>document.getElementById(id),chat=$('chat');
function bubble(text,role){const el=document.createElement('div');el.className='bubble '+role;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
function setMode(next){if(busy||!Object.hasOwn(MODES,next))return;mode=next;messages=[];chat.replaceChildren();bubble(MODES[mode],'bot');error('');document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));history.replaceState(null,'',location.pathname+(mode==='chat'?'':'?mode='+encodeURIComponent(mode)));}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));setMode(mode);
function status(text){$('status').textContent=text}function error(text){$('error').textContent=text}
$('reset').addEventListener('click',()=>{if(busy)return;messages=[];chat.replaceChildren();bubble(MODES[mode],'bot');error('')});
$('composer').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const text=$('message').value.trim();if(!text)return;error('');$('message').value='';bubble(text,'user');const next=[...messages.slice(-10),{role:'user',content:text}];busy=true;$('send').disabled=true;status('Thinking…');const pending=bubble('…','bot');try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:next,mode})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Unable to connect.');pending.textContent=data.reply;messages=[...next,{role:'assistant',content:data.reply}];status('Ready')}catch(err){pending.remove();error(err.message||'Connection failed.');$('message').value=text;status('Not available')}finally{busy=false;$('send').disabled=false;$('message').focus()}});
</script></body></html>
